services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: weather-timescaledb
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
      POSTGRES_DB: weather
    ports:
      - "5433:5432"
    volumes:
      - weather-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  weather-pgdata:
